<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="desertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <pattern id="scalePattern" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <g opacity="0.2">
        <circle cx="12" cy="12" r="8" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="25" cy="0" r="8" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="0" cy="25" r="8" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="25" cy="25" r="8" fill="none" stroke="#7f1d1d" stroke-width="1"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#desertGradient)"/>
  <rect width="200" height="200" fill="url(#scalePattern)"/>
  
  <!-- Large Snake silhouette -->
  <g opacity="0.8">
    <!-- Snake body (coiled) -->
    <path d="M100,50 Q80,70 60,90 Q40,110 50,130 Q60,150 80,160 Q100,170 120,160 Q140,150 150,130 Q160,110 140,90 Q120,70 100,50" 
          fill="#7f1d1d" stroke="#450a0a" stroke-width="3"/>
    
    <!-- Snake body continuation -->
    <path d="M100,50 Q120,30 140,40 Q160,50 170,70 Q180,90 160,100 Q140,110 120,100 Q100,90 100,70" 
          fill="#7f1d1d" stroke="#450a0a" stroke-width="3"/>
    
    <!-- Snake head -->
    <g transform="translate(100,50)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#7f1d1d"/>
      <path d="M-12,0 Q-18,-3 -20,0 Q-18,3 -12,0" fill="#7f1d1d"/>
      
      <!-- Snake eyes -->
      <circle cx="-8" cy="-3" r="2" fill="#fbbf24"/>
      <circle cx="-8" cy="3" r="2" fill="#fbbf24"/>
      <circle cx="-8" cy="-3" r="1" fill="#450a0a"/>
      <circle cx="-8" cy="3" r="1" fill="#450a0a"/>
      
      <!-- Forked tongue -->
      <path d="M-20,0 L-25,0 M-25,0 L-27,-2 M-25,0 L-27,2" stroke="#dc2626" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Scale details on body -->
    <g opacity="0.6">
      <ellipse cx="80" cy="80" rx="3" ry="6" fill="#450a0a" transform="rotate(45 80 80)"/>
      <ellipse cx="120" cy="120" rx="3" ry="6" fill="#450a0a" transform="rotate(-30 120 120)"/>
      <ellipse cx="140" cy="80" rx="3" ry="6" fill="#450a0a" transform="rotate(60 140 80)"/>
      <ellipse cx="100" cy="140" rx="3" ry="6" fill="#450a0a" transform="rotate(0 100 140)"/>
    </g>
  </g>
  
  <!-- Small lizard silhouette -->
  <g transform="translate(50,160)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="15" ry="5" fill="#7f1d1d"/>
    <ellipse cx="-10" cy="0" rx="5" ry="3" fill="#7f1d1d"/>
    <path d="M15,0 Q20,0 22,2 Q20,4 15,3" fill="#7f1d1d"/>
    <circle cx="-12" cy="-1" r="1" fill="#450a0a"/>
    <ellipse cx="-5" cy="-5" rx="2" ry="4" fill="#7f1d1d"/>
    <ellipse cx="5" cy="-5" rx="2" ry="4" fill="#7f1d1d"/>
    <ellipse cx="-5" cy="5" rx="2" ry="4" fill="#7f1d1d"/>
    <ellipse cx="5" cy="5" rx="2" ry="4" fill="#7f1d1d"/>
  </g>
  
  <!-- Desert elements -->
  <g opacity="0.4">
    <!-- Cactus silhouettes -->
    <g transform="translate(40,170)">
      <rect x="0" y="0" width="4" height="25" fill="#166534"/>
      <rect x="-2" y="10" width="8" height="3" fill="#166534"/>
      <circle cx="-1" cy="8" r="1" fill="#fbbf24"/>
      <circle cx="5" cy="12" r="1" fill="#fbbf24"/>
    </g>
    
    <g transform="translate(160,165)">
      <rect x="0" y="0" width="3" height="30" fill="#166534"/>
      <rect x="-2" y="15" width="7" height="2" fill="#166534"/>
      <circle cx="1" cy="10" r="1" fill="#fbbf24"/>
    </g>
    
    <!-- Rock formations -->
    <ellipse cx="70" cy="185" rx="15" ry="8" fill="#78716c" opacity="0.6"/>
    <ellipse cx="130" cy="180" rx="10" ry="5" fill="#78716c" opacity="0.6"/>
    
    <!-- Sand dunes -->
    <path d="M0,190 Q50,180 100,190 Q150,180 200,190 L200,200 L0,200 Z" fill="#f59e0b" opacity="0.3"/>
  </g>
  
  <!-- Heat shimmer effect -->
  <g opacity="0.2">
    <path d="M20,100 Q30,95 40,100 Q50,105 60,100" stroke="#fbbf24" stroke-width="1" fill="none"/>
    <path d="M140,60 Q150,55 160,60 Q170,65 180,60" stroke="#fbbf24" stroke-width="1" fill="none"/>
  </g>
</svg>