<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <pattern id="waves" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q10,0 20,10 T40,10" stroke="#bfdbfe" stroke-width="2" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#oceanGradient)"/>
  <rect width="200" height="200" fill="url(#waves)"/>
  
  <!-- Fish silhouettes -->
  <g opacity="0.4">
    <path d="M50,80 Q70,70 90,80 Q70,90 50,80 M85,75 L95,70 L95,85 Z" fill="#dbeafe"/>
    <path d="M120,120 Q140,110 160,120 Q140,130 120,120 M155,115 L165,110 L165,125 Z" fill="#dbeafe"/>
    <path d="M30,140 Q50,130 70,140 Q50,150 30,140 M65,135 L75,130 L75,145 Z" fill="#dbeafe"/>
  </g>
  
  <!-- Bubbles -->
  <g opacity="0.6">
    <circle cx="40" cy="50" r="3" fill="#f0f9ff"/>
    <circle cx="160" cy="60" r="2" fill="#f0f9ff"/>
    <circle cx="80" cy="160" r="4" fill="#f0f9ff"/>
    <circle cx="150" cy="170" r="2.5" fill="#f0f9ff"/>
    <circle cx="110" cy="40" r="2" fill="#f0f9ff"/>
  </g>
</svg>