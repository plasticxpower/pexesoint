<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <pattern id="clouds" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <ellipse cx="20" cy="20" rx="12" ry="6" fill="#f0f9ff" opacity="0.2"/>
      <ellipse cx="60" cy="20" rx="15" ry="8" fill="#f0f9ff" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#skyGradient)"/>
  <rect width="200" height="200" fill="url(#clouds)"/>
  
  <!-- Eagle silhouette -->
  <g transform="translate(100,100)" opacity="0.8">
    <!-- Eagle body -->
    <ellipse cx="0" cy="0" rx="12" ry="25" fill="#1e40af"/>
    
    <!-- Eagle head -->
    <ellipse cx="0" cy="-20" rx="8" ry="10" fill="#1e40af"/>
    
    <!-- Eagle beak -->
    <path d="M0,-25 L-6,-30 L-2,-28 Z" fill="#fbbf24"/>
    
    <!-- Eagle wings (spread) -->
    <g>
      <!-- Left wing -->
      <path d="M-12,-10 Q-35,-15 -50,-5 Q-55,0 -50,5 Q-40,10 -25,8 Q-15,5 -12,0" fill="#1e40af"/>
      <!-- Left wing feathers -->
      <path d="M-25,8 Q-30,12 -35,15 Q-40,12 -35,8" fill="#1e40af"/>
      <path d="M-35,8 Q-40,12 -45,15 Q-50,12 -45,8" fill="#1e40af"/>
      <path d="M-45,5 Q-50,8 -55,10 Q-58,7 -55,5" fill="#1e40af"/>
      
      <!-- Right wing -->
      <path d="M12,-10 Q35,-15 50,-5 Q55,0 50,5 Q40,10 25,8 Q15,5 12,0" fill="#1e40af"/>
      <!-- Right wing feathers -->
      <path d="M25,8 Q30,12 35,15 Q40,12 35,8" fill="#1e40af"/>
      <path d="M35,8 Q40,12 45,15 Q50,12 45,8" fill="#1e40af"/>
      <path d="M45,5 Q50,8 55,10 Q58,7 55,5" fill="#1e40af"/>
    </g>
    
    <!-- Eagle tail -->
    <path d="M-8,20 Q0,35 8,20 Q0,25 -8,20" fill="#1e40af"/>
    
    <!-- Eagle talons -->
    <g transform="translate(0,25)">
      <path d="M-3,0 L-5,8 M-1,0 L-1,8 M1,0 L1,8 M3,0 L5,8" stroke="#fbbf24" stroke-width="2" fill="none"/>
    </g>
  </g>
  
  <!-- Flying birds in background -->
  <g opacity="0.4">
    <path d="M40,60 Q50,55 60,60 Q55,65 50,60 Q45,65 40,60" fill="#1e40af"/>
    <path d="M130,50 Q140,45 150,50 Q145,55 140,50 Q135,55 130,50" fill="#1e40af"/>
    <path d="M160,140 Q170,135 180,140 Q175,145 170,140 Q165,145 160,140" fill="#1e40af"/>
    <path d="M30,150 Q40,145 50,150 Q45,155 40,150 Q35,155 30,150" fill="#1e40af"/>
  </g>
  
  <!-- Feathers floating -->
  <g opacity="0.3">
    <ellipse cx="70" cy="30" rx="2" ry="8" fill="#dbeafe" transform="rotate(15 70 30)"/>
    <ellipse cx="150" cy="170" rx="1.5" ry="6" fill="#dbeafe" transform="rotate(-20 150 170)"/>
    <ellipse cx="40" cy="180" rx="2" ry="7" fill="#dbeafe" transform="rotate(30 40 180)"/>
  </g>
</svg>