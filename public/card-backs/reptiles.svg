<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="desertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <pattern id="scalePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <g opacity="0.3">
        <circle cx="10" cy="10" r="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="20" cy="0" r="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="0" cy="20" r="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
        <circle cx="20" cy="20" r="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#desertGradient)"/>
  <rect width="200" height="200" fill="url(#scalePattern)"/>
  
  <!-- Reptile silhouettes -->
  <g opacity="0.5">
    <!-- Snake silhouette -->
    <path d="M30,50 Q60,30 90,50 Q120,70 150,50 Q170,40 180,60 Q170,80 150,90 Q120,110 90,90 Q60,70 30,90 Q20,70 30,50" 
          fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>
    
    <!-- Lizard silhouette -->
    <g transform="translate(100,130)">
      <ellipse cx="0" cy="0" rx="25" ry="8" fill="#7f1d1d"/>
      <ellipse cx="-15" cy="0" rx="8" ry="6" fill="#7f1d1d"/>
      <path d="M25,0 Q35,0 40,5 Q35,10 25,8" fill="#7f1d1d"/>
      <circle cx="-18" cy="-2" r="2" fill="#450a0a"/>
      <path d="M-10,-8 L-15,-15 M-5,-8 L-10,-15 M5,-8 L0,-15 M15,-8 L10,-15" 
            stroke="#7f1d1d" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Desert elements -->
  <g opacity="0.4">
    <!-- Cactus silhouettes -->
    <rect x="40" y="160" width="4" height="25" fill="#166534"/>
    <rect x="38" y="170" width="8" height="3" fill="#166534"/>
    
    <rect x="160" y="155" width="3" height="30" fill="#166534"/>
    <rect x="158" y="165" width="7" height="2" fill="#166534"/>
    
    <!-- Rock formations -->
    <ellipse cx="70" cy="185" rx="12" ry="6" fill="#78716c" opacity="0.6"/>
    <ellipse cx="130" cy="180" rx="8" ry="4" fill="#78716c" opacity="0.6"/>
  </g>
</svg>