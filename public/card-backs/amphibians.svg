<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="swampGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <pattern id="lilyPadPattern" x="0" y="0" width="70" height="70" patternUnits="userSpaceOnUse">
      <g opacity="0.2">
        <ellipse cx="35" cy="35" rx="25" ry="18" fill="#166534" transform="rotate(20 35 35)"/>
        <ellipse cx="20" cy="50" rx="15" ry="10" fill="#166534" transform="rotate(-15 20 50)"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#swampGradient)"/>
  <rect width="200" height="200" fill="url(#lilyPadPattern)"/>
  
  <!-- Large Frog silhouette -->
  <g transform="translate(100,110)" opacity="0.8">
    <!-- Frog body -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#064e3b"/>
    
    <!-- Frog head -->
    <ellipse cx="0" cy="-15" rx="25" ry="18" fill="#064e3b"/>
    
    <!-- Frog eyes (bulging) -->
    <circle cx="-12" cy="-25" r="8" fill="#064e3b"/>
    <circle cx="12" cy="-25" r="8" fill="#064e3b"/>
    <circle cx="-12" cy="-27" r="3" fill="#10b981"/>
    <circle cx="12" cy="-27" r="3" fill="#10b981"/>
    
    <!-- Frog mouth -->
    <ellipse cx="0" cy="-8" rx="15" ry="3" fill="#065f46"/>
    
    <!-- Frog front legs -->
    <ellipse cx="-25" cy="-5" rx="8" ry="12" fill="#064e3b" transform="rotate(-30 -25 -5)"/>
    <ellipse cx="25" cy="-5" rx="8" ry="12" fill="#064e3b" transform="rotate(30 25 -5)"/>
    
    <!-- Frog back legs (powerful) -->
    <ellipse cx="-30" cy="10" rx="12" ry="18" fill="#064e3b" transform="rotate(-20 -30 10)"/>
    <ellipse cx="30" cy="10" rx="12" ry="18" fill="#064e3b" transform="rotate(20 30 10)"/>
    
    <!-- Frog feet -->
    <ellipse cx="-35" cy="25" rx="8" ry="6" fill="#064e3b" transform="rotate(-10 -35 25)"/>
    <ellipse cx="35" cy="25" rx="8" ry="6" fill="#064e3b" transform="rotate(10 35 25)"/>
    
    <!-- Frog toes -->
    <g opacity="0.8">
      <circle cx="-38" cy="28" r="2" fill="#064e3b"/>
      <circle cx="-32" cy="30" r="2" fill="#064e3b"/>
      <circle cx="38" cy="28" r="2" fill="#064e3b"/>
      <circle cx="32" cy="30" r="2" fill="#064e3b"/>
    </g>
  </g>
  
  <!-- Water ripples around frog -->
  <g opacity="0.3">
    <circle cx="100" cy="110" r="50" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="100" cy="110" r="65" fill="none" stroke="#10b981" stroke-width="1"/>
    <circle cx="100" cy="110" r="80" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Small tadpoles -->
  <g opacity="0.4">
    <g transform="translate(60,60)">
      <circle cx="0" cy="0" r="4" fill="#064e3b"/>
      <path d="M4,0 Q8,0 12,2 Q10,4 8,2 Q6,0 4,0" fill="#064e3b"/>
    </g>
    <g transform="translate(140,160)">
      <circle cx="0" cy="0" r="3" fill="#064e3b"/>
      <path d="M3,0 Q6,0 9,1 Q8,3 6,1 Q4,0 3,0" fill="#064e3b"/>
    </g>
  </g>
  
  <!-- Lily pads with flowers -->
  <g opacity="0.5">
    <g transform="translate(50,50)">
      <ellipse cx="0" cy="0" rx="15" ry="10" fill="#166534"/>
      <path d="M15,0 L12,-3 L15,-6" stroke="#166534" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
      <circle cx="-2" cy="-1" r="1" fill="#f8fafc"/>
      <circle cx="2" cy="-1" r="1" fill="#f8fafc"/>
      <circle cx="0" cy="2" r="1" fill="#f8fafc"/>
    </g>
    <g transform="translate(150,40)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#166534"/>
      <circle cx="0" cy="0" r="3" fill="#ec4899"/>
    </g>
  </g>
  
  <!-- Cattails -->
  <g opacity="0.4">
    <rect x="30" y="170" width="2" height="25" fill="#166534"/>
    <ellipse cx="31" cy="165" rx="2" ry="5" fill="#92400e"/>
    
    <rect x="170" y="175" width="2" height="20" fill="#166534"/>
    <ellipse cx="171" cy="170" rx="2" ry="4" fill="#92400e"/>
  </g>
</svg>