<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <pattern id="pawPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <g opacity="0.2">
        <circle cx="25" cy="20" r="3" fill="#451a03"/>
        <circle cx="20" cy="30" r="2" fill="#451a03"/>
        <circle cx="30" cy="30" r="2" fill="#451a03"/>
        <circle cx="18" cy="35" r="1.5" fill="#451a03"/>
        <circle cx="32" cy="35" r="1.5" fill="#451a03"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#earthGradient)"/>
  <rect width="200" height="200" fill="url(#pawPattern)"/>
  
  <!-- Animal silhouettes -->
  <g opacity="0.4">
    <!-- Bear silhouette -->
    <ellipse cx="60" cy="80" rx="15" ry="20" fill="#7c2d12"/>
    <circle cx="60" cy="65" r="8" fill="#7c2d12"/>
    <circle cx="55" cy="60" r="3" fill="#7c2d12"/>
    <circle cx="65" cy="60" r="3" fill="#7c2d12"/>
    
    <!-- Deer silhouette -->
    <ellipse cx="140" cy="120" rx="12" ry="18" fill="#7c2d12"/>
    <ellipse cx="140" cy="105" rx="6" ry="8" fill="#7c2d12"/>
    <path d="M135,95 L130,85 M145,95 L150,85" stroke="#7c2d12" stroke-width="2"/>
    
    <!-- Small mammal -->
    <ellipse cx="50" cy="150" rx="8" ry="6" fill="#7c2d12"/>
    <circle cx="45" cy="145" r="4" fill="#7c2d12"/>
  </g>
  
  <!-- Larger paw prints -->
  <g opacity="0.3">
    <g transform="translate(100,60)">
      <circle cx="0" cy="-5" r="4" fill="#451a03"/>
      <circle cx="-5" cy="5" r="3" fill="#451a03"/>
      <circle cx="5" cy="5" r="3" fill="#451a03"/>
      <circle cx="-8" cy="12" r="2" fill="#451a03"/>
      <circle cx="8" cy="12" r="2" fill="#451a03"/>
    </g>
    <g transform="translate(80,140) rotate(30)">
      <circle cx="0" cy="-5" r="3" fill="#451a03"/>
      <circle cx="-4" cy="4" r="2" fill="#451a03"/>
      <circle cx="4" cy="4" r="2" fill="#451a03"/>
      <circle cx="-6" cy="10" r="1.5" fill="#451a03"/>
      <circle cx="6" cy="10" r="1.5" fill="#451a03"/>
    </g>
  </g>
</svg>