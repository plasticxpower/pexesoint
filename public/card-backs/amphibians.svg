<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="swampGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <pattern id="lilyPadPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <g opacity="0.3">
        <ellipse cx="30" cy="30" rx="20" ry="15" fill="#166534" transform="rotate(20 30 30)"/>
        <ellipse cx="15" cy="45" rx="12" ry="8" fill="#166534" transform="rotate(-15 15 45)"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#swampGradient)"/>
  <rect width="200" height="200" fill="url(#lilyPadPattern)"/>
  
  <!-- Water ripples -->
  <g opacity="0.2">
    <circle cx="50" cy="80" r="15" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="50" cy="80" r="25" fill="none" stroke="#10b981" stroke-width="1"/>
    <circle cx="150" cy="120" r="12" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="150" cy="120" r="20" fill="none" stroke="#10b981" stroke-width="1"/>
  </g>
  
  <!-- Amphibian silhouettes -->
  <g opacity="0.5">
    <!-- Frog silhouette -->
    <g transform="translate(80,100)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#064e3b"/>
      <circle cx="-12" cy="-8" r="6" fill="#064e3b"/>
      <circle cx="12" cy="-8" r="6" fill="#064e3b"/>
      <circle cx="-15" cy="-12" r="3" fill="#064e3b"/>
      <circle cx="15" cy="-12" r="3" fill="#064e3b"/>
      <ellipse cx="-20" cy="5" rx="8" ry="6" fill="#064e3b"/>
      <ellipse cx="20" cy="5" rx="8" ry="6" fill="#064e3b"/>
    </g>
    
    <!-- Salamander silhouette -->
    <g transform="translate(120,60)">
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="#064e3b"/>
      <ellipse cx="-15" cy="0" rx="6" ry="4" fill="#064e3b"/>
      <path d="M20,0 Q30,0 35,3 Q30,6 20,4" fill="#064e3b"/>
      <ellipse cx="-8" cy="-8" rx="3" ry="6" fill="#064e3b"/>
      <ellipse cx="8" cy="-8" rx="3" ry="6" fill="#064e3b"/>
      <ellipse cx="-8" cy="8" rx="3" ry="6" fill="#064e3b"/>
      <ellipse cx="8" cy="8" rx="3" ry="6" fill="#064e3b"/>
    </g>
    
    <!-- Tadpole silhouette -->
    <g transform="translate(60,150)">
      <circle cx="0" cy="0" r="8" fill="#064e3b"/>
      <path d="M8,0 Q15,0 20,3 Q18,6 15,3 Q12,0 8,0" fill="#064e3b"/>
    </g>
  </g>
  
  <!-- Pond vegetation -->
  <g opacity="0.4">
    <!-- Cattails -->
    <rect x="30" y="170" width="2" height="20" fill="#166534"/>
    <ellipse cx="31" cy="165" rx="1.5" ry="4" fill="#92400e"/>
    
    <rect x="170" y="175" width="2" height="15" fill="#166534"/>
    <ellipse cx="171" cy="170" rx="1.5" ry="3" fill="#92400e"/>
    
    <!-- Water lilies -->
    <g transform="translate(40,40)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#166534"/>
      <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
      <ellipse cx="-3" cy="0" rx="1" ry="3" fill="#f8fafc"/>
      <ellipse cx="3" cy="0" rx="1" ry="3" fill="#f8fafc"/>
      <ellipse cx="0" cy="-3" rx="3" ry="1" fill="#f8fafc"/>
      <ellipse cx="0" cy="3" rx="3" ry="1" fill="#f8fafc"/>
    </g>
  </g>
</svg>